<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Академияи Рақамӣ — Бақайдгирӣ</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Академияи Рақамӣ</h1>
            <p>Марҳамат, барои ворид шудан ба платформа маълумоти худро пур кунед.</p>

            <form id="registration-form">
                <div class="form-group">
                    <label for="language-select">🌐 Забони интерфейс:</label>
                    <select id="language-select">
                        <option value="tg">Тоҷикӣ</option>
                        <option value="ru">Русский</option>
                        <option value="en">English</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="fullname">Ному насаб:</label>
                    <input type="text" id="fullname" required>
                </div>

                <div class="form-group">
                    <label for="grade-select">Синф:</label>
                    <select id="grade-select">
                        <option value="1">Синфи 1</option>
                        <option value="2">Синфи 2</option>
                        <option value="3">Синфи 3</option>
                        <option value="4">Синфи 4</option>
                        <option value="5" selected>Синфи 5</option>
                        <option value="6">Синфи 6</option>
                        <option value="7">Синфи 7</option>
                        <option value="8">Синфи 8</option>
                        <option value="9">Синфи 9</option>
                        <option value="10">Синфи 10</option>
                        <option value="11">Синфи 11</option>
                    </select>
                </div>
<div class="form-group">
    <label for="subject-select">📚 Интихоби фан:</label>
    <select id="subject-select" style="padding: 10px; width: 100%; margin-bottom: 15px; font-size: 16px; border-radius: 5px;">
        <option value="math">Математика</option>
        <option value="physics">Физика</option>
        <option value="chemistry">Химия</option>
        <option value="tajik">Забони тоҷикӣ</option>
        <option value="history">Таърихи тоҷикон</option>
        <option value="geography">География</option>
        <option value="biology">Биология</option>
        <option value="informatics">Информатика</option>
        <option value="russian">Забони русӣ</option>
        <option value="english">Забони англисӣ</option>
    </select>
</div>
                <div class="form-group">
                    <label for="school">Муассисаи таълимӣ (мактаб/литсей):</label>
                    <input type="text" id="school" required>
                </div>

                <div class="form-group">
                    <label for="region">Шаҳр ё ноҳия:</label>
                    <input type="text" id="region" required>
                </div>

                <button type="submit" class="btn">Ворид шудан ба платформа</button>
            </form>
            <!-- Контейнере, ки пас аз бақайдгирӣ саволҳои фанҳоро нишон медиҳад -->
<div id="math-container" style="display: none; margin-top: 20px;"></div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
